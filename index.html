<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09111f">
  <title>Tempest Meteo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09111f;
      --panel: #111d2e;
      --panel2: #16253a;
      --line: #25364d;
      --text: #f2f6fc;
      --muted: #9bacbf;
      --accent: #48c6ef;
      --accent2: #8a7dff;
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px 40px;
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
      background:
        radial-gradient(ellipse at 15% 0%, #193356 0, transparent 42%),
        radial-gradient(ellipse at 95% 15%, #28234d 0, transparent 35%),
        var(--bg);
    }
    main { width: min(1050px, 100%); margin: auto; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; margin-bottom: 22px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 46px; height: 46px; display: grid; place-items: center;
      border-radius: 15px; font-size: 25px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
    }
    h1 { margin: 0; font-size: 21px; }
    .subtitle, .muted { color: var(--muted); }
    .subtitle { font-size: 13px; }
    .panel {
      padding: 20px; margin-bottom: 16px; border: 1px solid var(--line);
      border-radius: var(--radius); background: #111d2ee8;
      box-shadow: 0 12px 36px #0002;
    }
    .search-row { display: flex; gap: 10px; }
    input, button {
      min-height: 46px; border-radius: 12px; font: inherit;
    }
    input {
      width: 100%; padding: 10px 13px; color: var(--text);
      border: 1px solid var(--line); background: #0a1422;
    }
    button {
      padding: 10px 17px; color: #06121d; font-weight: 750;
      border: 0; cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #85e1f8);
    }
    button:disabled { opacity: .6; cursor: wait; }
    .status { min-height: 23px; margin-top: 8px; color: var(--muted); }
    .error { color: #ff9a9a; }
    .hero {
      display: flex; justify-content: space-between; align-items: center;
      gap: 15px; flex-wrap: wrap;
    }
    .place { font-size: 21px; font-weight: 750; }
    .condition { color: var(--muted); }
    .temperature { font-size: clamp(52px, 11vw, 82px); line-height: 1; font-weight: 750; }
    .weather-icon { font-size: 57px; }
    .details {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 10px; margin-top: 20px;
    }
    .detail, .day, .stat {
      padding: 13px; border: 1px solid var(--line); border-radius: 14px;
      background: var(--panel2);
    }
    .detail small, .stat small { display: block; color: var(--muted); }
    .detail strong, .stat b { display: block; margin-top: 4px; font-size: 17px; }
    h2 { margin: 0 0 14px; font-size: 18px; }
    .forecast {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 9px;
    }
    .day { text-align: center; }
    .day-name { font-weight: 700; }
    .day-icon { margin: 5px 0; font-size: 25px; }
    .day-temps { font-weight: 700; }
    .day-rain { color: var(--muted); font-size: 12px; }
    .date-row {
      display: grid; grid-template-columns: 1fr 1fr auto;
      align-items: end; gap: 10px;
    }
    label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 5px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
    .chart {
      display: flex; align-items: end; gap: 5px; min-height: 150px;
      padding: 12px 4px 0; overflow-x: auto;
    }
    .bar-wrap {
      min-width: 29px; height: 125px; display: flex; flex-direction: column;
      justify-content: end; align-items: center; gap: 5px;
    }
    .bar {
      width: 19px; min-height: 3px; border-radius: 7px 7px 2px 2px;
      background: linear-gradient(0deg, var(--accent2), var(--accent));
    }
    .bar-label { color: var(--muted); font-size: 10px; white-space: nowrap; }
    footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
    [hidden] { display: none !important; }
    @media (max-width: 650px) {
      .forecast { grid-template-columns: repeat(4, 1fr); }
      .details { grid-template-columns: repeat(2, 1fr); }
      .date-row { grid-template-columns: 1fr 1fr; }
      .date-row button { grid-column: 1 / -1; }
    }
    @media (max-width: 390px) {
      .forecast { grid-template-columns: repeat(2, 1fr); }
      .search-row { flex-direction: column; }
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">🌦️</div>
      <div>
        <h1>Tempest Meteo</h1>
        <div class="subtitle">Meteo attuale, previsioni e storico</div>
      </div>
    </div>
  </header>

  <section class="panel">
    <form id="searchForm" class="search-row">
      <input id="cityInput" type="search" placeholder="Cerca una città, ad esempio Roma" aria-label="Nome città" required>
      <button id="searchButton" type="submit">Cerca città</button>
    </form>
    <div id="searchStatus" class="status" role="status"></div>
  </section>

  <section id="currentPanel" class="panel" hidden>
    <div class="hero">
      <div>
        <div id="place" class="place"></div>
        <div id="currentDescription" class="condition"></div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span id="currentIcon" class="weather-icon" aria-hidden="true"></span>
        <div id="currentTemp" class="temperature"></div>
      </div>
    </div>
    <div class="details">
      <div class="detail"><small>Sensazione</small><strong id="feels"></strong></div>
      <div class="detail"><small>Umidità</small><strong id="humidity"></strong></div>
      <div class="detail"><small>Vento</small><strong id="wind"></strong></div>
      <div class="detail"><small>Pioggia oggi</small><strong id="rain"></strong></div>
    </div>
  </section>

  <section id="forecastPanel" class="panel" hidden>
    <h2>Previsioni — prossimi 7 giorni</h2>
    <div id="forecast" class="forecast"></div>
  </section>

  <section class="panel">
    <h2>Storico meteo</h2>
    <p class="muted">Consulta temperature e precipitazioni giornaliere per la città selezionata.</p>
    <form id="historyForm" class="date-row">
      <div>
        <label for="dateOne">Dal</label>
        <input id="dateOne" type="date" required>
      </div>
      <div>
        <label for="dateTwo">Al</label>
        <input id="dateTwo" type="date" required>
      </div>
      <button id="historyButton" type="submit">Carica storico</button>
    </form>
    <div id="historyStatus" class="status" role="status">Cerca una città per consultare lo storico.</div>
    <div id="historyResult" hidden>
      <div id="historyStats" class="stats"></div>
      <div id="historyChart" class="chart" aria-label="Grafico delle temperature massime giornaliere"></div>
    </div>
  </section>

  <footer>Dati meteo forniti da Open-Meteo.</footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let selectedLocation = null;

  function weatherInfo(code) {
    if (code === 0) return ["Sereno", "☀️"];
    if ([1, 2].includes(code)) return ["Poco nuvoloso", "🌤️"];
    if (code === 3) return ["Nuvoloso", "☁️"];
    if ([45, 48].includes(code)) return ["Nebbia", "🌫️"];
    if ([51, 53, 55, 56, 57].includes(code)) return ["Pioviggine", "🌦️"];
    if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return ["Pioggia", "🌧️"];
    if ([71, 73, 75, 77, 85, 86].includes(code)) return ["Neve", "🌨️"];
    if ([95, 96, 99].includes(code)) return ["Temporale", "⛈️"];
    return ["Condizioni variabili", "🌡️"];
  }

  function localDateInput(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  async function getJson(url) {
    const response = await fetch(url);
    if (!response.ok) throw new Error("Il servizio meteo non ha risposto. Riprova tra poco.");
    const data = await response.json();
    if (data.error) throw new Error(data.reason || "Errore nella richiesta.");
    return data;
  }

  async function loadWeather(location) {
    selectedLocation = location;
    $("searchStatus").textContent = "Caricamento dei dati meteo…";
    $("searchStatus").classList.remove("error");
    $("searchButton").disabled = true;

    try {
      const params = new URLSearchParams({
        latitude: location.latitude,
        longitude: location.longitude,
        daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum",
        current: "temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m",
        timezone: "auto",
        forecast_days: "7"
      });
      const data = await getJson(`https://api.open-meteo.com/v1/forecast?${params}`);
      const country = location.country ? `, ${location.country}` : "";
      $("place").textContent = `${location.name}${country}`;
      const [description, icon] = weatherInfo(data.current.weather_code);
      $("currentDescription").textContent = description;
      $("currentIcon").textContent = icon;
      $("currentTemp").textContent = `${Math.round(data.current.temperature_2m)}°`;
      $("feels").textContent = `${Math.round(data.current.apparent_temperature)} °C`;
      $("humidity").textContent = `${data.current.relative_humidity_2m}%`;
      $("wind").textContent = `${Math.round(data.current.wind_speed_10m)} km/h`;
      const todayRain = data.daily.precipitation_sum?.[0] ?? data.current.precipitation ?? 0;
      $("rain").textContent = `${Number(todayRain).toFixed(1)} mm`;
      $("currentPanel").hidden = false;

      $("forecast").innerHTML = "";
      data.daily.time.forEach((date, i) => {
        const [desc, dayIcon] = weatherInfo(data.daily.weather_code[i]);
        const weekday = new Date(`${date}T12:00:00`).toLocaleDateString("it-IT", { weekday: "short" });
        const card = document.createElement("div");
        card.className = "day";
        card.innerHTML = `
          <div class="day-name">${weekday}</div>
          <div class="day-icon" title="${desc}">${dayIcon}</div>
          <div class="day-temps">${Math.round(data.daily.temperature_2m_max[i])}° / ${Math.round(data.daily.temperature_2m_min[i])}°</div>
          <div class="day-rain">${Number(data.daily.precipitation_sum[i] || 0).toFixed(1)} mm</div>`;
        $("forecast").appendChild(card);
      });
      $("forecastPanel").hidden = false;
      $("searchStatus").textContent = `Dati aggiornati per ${location.name}.`;
      $("historyStatus").textContent = `Seleziona un intervallo per ${location.name}.`;
    } catch (error) {
      $("searchStatus").textContent = error.message;
      $("searchStatus").classList.add("error");
    } finally {
      $("searchButton").disabled = false;
    }
  }

  $("searchForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const query = $("cityInput").value.trim();
    if (!query) return;
    $("searchStatus").textContent = "Ricerca della città…";
    $("searchStatus").classList.remove("error");
    $("searchButton").disabled = true;

    try {
      const params = new URLSearchParams({ name: query, count: "1", language: "it", format: "json" });
      const result = await getJson(`https://geocoding-api.open-meteo.com/v1/search?${params}`);
      if (!result.results?.length) throw new Error("Città non trovata. Controlla il nome e riprova.");
      await loadWeather(result.results[0]);
    } catch (error) {
      $("searchStatus").textContent = error.message;
      $("searchStatus").classList.add("error");
      $("searchButton").disabled = false;
    }
  });

  $("historyForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!selectedLocation) {
      $("historyStatus").textContent = "Cerca prima una città.";
      $("historyStatus").classList.add("error");
      return;
    }
    const start = $("dateOne").value;
    const end = $("dateTwo").value;
    if (!start || !end || start > end) {
      $("historyStatus").textContent = "Inserisci un intervallo di date valido.";
      $("historyStatus").classList.add("error");
      return;
    }
    const today = localDateInput(new Date());
    if (end >= today) {
      $("historyStatus").textContent = "Per lo storico seleziona date concluse, precedenti a oggi.";
      $("historyStatus").classList.add("error");
      return;
    }

    $("historyButton").disabled = true;
    $("historyStatus").classList.remove("error");
    $("historyStatus").textContent = "Caricamento dello storico…";
    $("historyResult").hidden = true;

    try {
      const params = new URLSearchParams({
        latitude: selectedLocation.latitude,
        longitude: selectedLocation.longitude,
        start_date: start,
        end_date: end,
        daily: "temperature_2m_max,temperature_2m_min,precipitation_sum",
        timezone: "auto"
      });
      const data = await getJson(`https://archive-api.open-meteo.com/v1/archive?${params}`);
      const highs = data.daily.temperature_2m_max || [];
      const lows = data.daily.temperature_2m_min || [];
      const rain = data.daily.precipitation_sum || [];
      const validHighs = highs.filter(Number.isFinite);
      const validLows = lows.filter(Number.isFinite);
      if (!validHighs.length) throw new Error("Nessun dato disponibile per queste date.");
      const avg = validHighs.reduce((a, b) => a + b, 0) / validHighs.length;
      const max = Math.max(...validHighs);
      const totalRain = rain.filter(Number.isFinite).reduce((a, b) => a + b, 0);
      $("historyStats").innerHTML = `
        <div class="stat"><small>Massima media</small><b>${avg.toFixed(1)} °C</b></div>
        <div class="stat"><small>Massima del periodo</small><b>${max.toFixed(1)} °C</b></div>
        <div class="stat"><small>Precipitazioni totali</small><b>${totalRain.toFixed(1)} mm</b></div>`;

      const minValue = validLows.length ? Math.min(...validLows) : Math.min(...validHighs);
      const maxValue = Math.max(...validHighs);
      const span = Math.max(1, maxValue - minValue);
      $("historyChart").innerHTML = "";
      highs.forEach((value, index) => {
        if (!Number.isFinite(value)) return;
        const height = 18 + ((value - minValue) / span) * 78;
        const date = data.daily.time[index];
        const label = new Date(`${date}T12:00:00`).toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit" });
        const bar = document.createElement("div");
        bar.className = "bar-wrap";
        bar.title = `${date}: massima ${value.toFixed(1)} °C; minima ${lows[index] ?? "—"} °C`;
        bar.innerHTML = `<div class="bar" style="height:${height}%"></div><span class="bar-label">${label}</span>`;
        $("historyChart").appendChild(bar);
      });
      $("historyResult").hidden = false;
      $("historyStatus").textContent = `Storico dal ${start} al ${end}.`;
    } catch (error) {
      $("historyStatus").textContent = error.message;
      $("historyStatus").classList.add("error");
    } finally {
      $("historyButton").disabled = false;
    }
  });

  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  $("dateOne").value = localDateInput(yesterday);
  $("dateTwo").value = localDateInput(yesterday);
  $("dateOne").max = localDateInput(yesterday);
  $("dateTwo").max = localDateInput(yesterday);
  $("cityInput").value = "Roma";
  loadWeather({
    name: "Roma",
    country: "Italia",
    latitude: 41.8919,
    longitude: 12.5113
  });
</script>
</body>
</html>
